# macOS 用の既定値（Intel Mac 想定）。
# os.name から自動で有効になる（jp.clip.transcribeshell.config.OsProfile）。
# ここに書いていない項目は TranscribeProperties のフィールド初期値がそのまま効く。

# 録音の置き場。ユーザー名に依存しないようホーム基準にする。
transcribe.default-dir=${user.home}/Music

# Python の起動子。Mac に "py" は無い。cpp エンジンでは使わないが、openai に切り替えたときの保険。
transcribe.py-path=python3

# Python を入れずに使えるようにするため、Mac では whisper.cpp を既定にする。
transcribe.whisper.engine=cpp

# 幻覚ループ対策。whisper.cpp の既定（文脈を無制限に引き継ぐ）だと、同じ文の繰り返しで
# 出力が崩れることを実測で確認している（docs/ENGINE_BENCHMARK.md）。
# Java 側の既定も 0 だが、この設定が品質の前提であることを明示するため敢えて書いている。
transcribe.whisper.cpp.max-context=0

# transcribe-ffm（FFM）はこの OS 用のネイティブが jar に同梱されていないと使えない。
# 同梱されるのは Windows 用だけなので、この OS では transcribe（engine=cpp = whisper-cli）を使う。
# FFM を使いたい場合は whisper-ffm をこの OS でビルドして publishToMavenLocal し直すこと。

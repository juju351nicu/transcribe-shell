spring.application.name=transcribe-shell

# ---------------------------------------------------------------------------
# transcribe-ffm（whisper.cpp を FFM で JVM 内から呼ぶ）の設定。
# transcribe --engine cpp（外部バイナリ whisper-cli / 設定は transcribe.whisper.cpp.*）とは別経路。
# 既定値は Java 側（FfmProperties）に書いてあり、ここは上書きしたいときだけ使う。
# 再ビルドせずに試すなら  java -Dtranscribe.ffm.<キー>=<値> ... -jar ...  でも効く。
# ---------------------------------------------------------------------------
# transcribe.ffm.model-dir=${user.home}/whisper-models
# transcribe.ffm.native-library-dir=
# transcribe.ffm.threads=0

# VAD は既定 off。両刃なので既定にはできない（同一音声 6 part の実測）:
#   崩壊していた 3 part を直した（同一行 55/14/60 行連続 -> 1 行）
#   正常な 2 part への影響は小（-0.4%, -6.5%）だが、正常な 1 part を壊した（4.02 -> 0.67 文字per秒）
# どちらに転ぶかは無音率でも音量でも vad-threshold でも予測できなかった。
# 運用: 警告が出た part だけ --vad を試し、悪化したら戻す（README「警告が出た part の直し方」）
# transcribe.ffm.vad=false
# transcribe.ffm.vad-speech-pad-ms=30
# transcribe.ffm.vad-threshold=0.5

# デコーダ。whisper.cpp の既定（best-of 5 / temperature-increment 0.2）だと繰り返しが増えたため実測値を採用
# transcribe.ffm.best-of=-1
# transcribe.ffm.beam-size=2
# transcribe.ffm.temperature-increment=0.4
# transcribe.ffm.entropy-threshold=2.4
# transcribe.ffm.suppress-non-speech-tokens=true

# 繰り返しループ対策。max-text-context を 0 にすると引き継ぎは止まるが初期プロンプトも無効になる。
# carry-initial-prompt=true は 2026-09-08 に実測して不採用（固有名詞は良くなるがプロンプト自体が 42 回繰り返された）
# transcribe.ffm.max-text-context=16384
# transcribe.ffm.carry-initial-prompt=false

# 品質チェック（警告のみ。.txt は必ず書き出す）。0 以下でその指標を無効化。
# 幻聴のループは例外にならず「done」で終わるため、気づかないまま議事録が壊れるのを防ぐ。
# 実測(3 録音 8 part): 崩壊 = 同一行 16 / 55 / 67 行連続、崩壊なしの最大 = 3 行
# 文字per秒は補助。67 行連続の part は総文字数が減らず 5.07(正常値)だったので、連続同一行の指標が要る
# transcribe.ffm.repetition-warn-lines=5
# transcribe.ffm.min-chars-per-audio-second=2.5

# 初期プロンプト（固有名詞のヒント）。.properties は ISO-8859-1 で読まれるため日本語はファイル側に置く。
# 参加者名を書くので、公開リポジトリに入らないようホーム直下が既定。書き方は docs/whisper-prompt.sample.txt
# transcribe.ffm.initial-prompt-file=${user.home}/whisper-prompt.txt

# ---------------------------------------------------------------------------
# transcribe コマンドのエンジン。faster / openai / cpp の 3 つだけ。
# 打ち間違いや ffm と書いた場合は起動時ではなく実行時に例外になる（黙って faster が動かないようにした）。
# FFM 版は engine では選べない。transcribe-ffm という別コマンド。
# 既定は faster。OS ごとの既定は application-mac / application-linux.properties にある。
# ---------------------------------------------------------------------------
# transcribe.whisper.engine=faster

# whisper.cpp 自身のログ（モデル読み込み時の大量の INFO）は抑える。調査時は INFO に戻す
logging.level.whisper.cpp=WARN
